<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 400px; /* Increased width */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 15px;
      background-color: #f4f6f8;
      color: #333;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 18px;
      color: #2c3e50;
      text-align: center;
    }
    p {
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
      text-align: center;
    }
    textarea {
      width: 100%;
      height: 300px; /* Increased height */
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
      resize: vertical;
      margin-bottom: 10px;
    }
    textarea:focus {
      outline: none;
      border-color: #3498db;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: background 0.2s;
    }
    
    /* Blue Button for Scanning */
    #scanBtn {
      background-color: #3498db;
      color: white;
    }
    #scanBtn:hover {
      background-color: #2980b9;
    }

    /* Green Button for Filling */
    #fillBtn {
      background-color: #27ae60;
      color: white;
    }
    #fillBtn:hover {
      background-color: #219150;
    }

    /* Red Button for Clearing */
    #clearBtn {
      background-color: #e74c3c;
      color: white;
      margin-top: 5px;
    }
    #clearBtn:hover {
      background-color: #c0392b;
    }

    #status {
      margin-top: 5px;
      font-size: 13px;
      text-align: center;
      min-height: 18px;
      color: #2c3e50;
    }
  </style>
</head>
<body>
  <h2>Smart Form Filler</h2>
  <p>Scan page to get labels, or paste data to fill.</p>
  
  <button id="scanBtn">Scan Page & Generate Template</button>

  <textarea id="dataInput" placeholder="Label : Value..."></textarea>
  
  <button id="fillBtn">Autofill Form</button>
  <button id="clearBtn">Clear Data</button>
  
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
